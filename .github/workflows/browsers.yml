# @file   .github/workflows/browsers.yml
# @brief  The Playwright journeys in every browser and size, nightly on master and on demand.
#
# Responsibility: the required CI job runs the browser tests in Chromium only (./ci.yml, job e2e);
#                 Chromium at phone size, Firefox and WebKit at desktop and phone sizes run here
#                 (e2e/playwright.config.ts): at 02:30 UTC every night on master, and when started
#                 by hand on the branch chosen (CLAUDE.md "Tests and checks"). Journey 5 reads its
#                 mails from Mailpit's API, so the same service as in ./ci.yml runs beside it. A
#                 failure is listed in docs/BACKLOG.md under the Firefox/WebKit findings; nothing
#                 waits for this run.
#                 After seasonal-mini-games .github/workflows/browsers.yml, with its action SHAs.
# Depends on:     .github/actions/setup, e2e/
name: Browsers

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browsers
  cancel-in-progress: false

jobs:
  firefox-webkit:
    runs-on: ubuntu-latest
    # The mails of journey 5, as in ./ci.yml and on the dev machine (ops/compose.dev.yml: SMTP
    # 1170, API 8570). The same image, pinned by digest.
    services:
      mailpit:
        image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
        ports:
          - 1170:1025
          - 8570:8025
    steps:
      # The ref the run was started for: master by the schedule, the chosen branch by hand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Playwright browsers (Chromium, Firefox, WebKit)
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Every browser and size
        run: pnpm e2e --project=chromium-mobile --project=firefox --project=firefox-mobile --project=webkit --project=webkit-mobile
      # On a failure: the traces and page snapshots of the failed tests, for a week.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-firefox-webkit
          path: test-results
          retention-days: 7
