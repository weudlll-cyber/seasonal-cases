# @file   .github/workflows/browsers.yml
# @brief  The Playwright suite in every browser and size on master, nightly and on demand.
#
# Responsibility: every push runs the browser tests in Chromium only (./ci.yml, job e2e, once
#                 the suite exists); Chromium at phone size, Firefox and WebKit at desktop and
#                 phone sizes run here (e2e/playwright.config.ts), on master, at 02:30 UTC every
#                 night and when started by hand (CLAUDE.md "Tests and checks"). Until master
#                 holds e2e/playwright.config.ts the job only says so. A failure is listed in
#                 docs/BACKLOG.md under the Firefox/WebKit findings; nothing waits for this run.
#                 After seasonal-mini-games .github/workflows/browsers.yml, with its action SHAs.
# Depends on:     .github/actions/setup, e2e/
name: Browsers

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browsers
  cancel-in-progress: false

jobs:
  firefox-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: No browser suite on master yet
        if: hashFiles('e2e/playwright.config.ts') == ''
        run: echo "::notice::master has no e2e/playwright.config.ts yet; nothing to run."
      - if: hashFiles('e2e/playwright.config.ts') != ''
        uses: ./.github/actions/setup
      - name: Playwright browsers (Chromium, Firefox, WebKit)
        if: hashFiles('e2e/playwright.config.ts') != ''
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Every browser and size
        if: hashFiles('e2e/playwright.config.ts') != ''
        run: pnpm e2e --project=chromium-mobile --project=firefox --project=firefox-mobile --project=webkit --project=webkit-mobile
      # On a failure: the traces and page snapshots of the failed tests, for a week.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-firefox-webkit
          path: test-results
          retention-days: 7
