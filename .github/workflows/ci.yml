# @file   .github/workflows/ci.yml
# @brief  CI: verify with coverage, security scans, the docs' link check, the installer, the
#         browser journeys in Chromium and the production image's scan.
#
# Responsibility: run what "pnpm verify" runs and the domain/application coverage, the
#                 kit-version notice (never a failure), the
#                 dependency and secret scans, the markdown link check, the Playwright
#                 journeys, and the production image (built, searched for development tools,
#                 scanned with Trivy) on every push to master and every pull request against it.
#                 Any red job blocks a merge.
#                 After seasonal-mini-games .github/workflows/ci.yml; action SHAs and image
#                 digests are its own.
# Depends on:     .github/actions/setup, osv-scanner.toml, e2e/, ops/, Dockerfile
name: CI

on:
  push:
    # master only: a push to a branch with an open pull request would start a second identical run.
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # One group per branch and event: a pull request's new commit cancels the run of the one before.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  # Every merge commit on master must get its own finished run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Scanner images pinned by digest, like the actions by commit SHA.
env:
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
  LYCHEE_IMAGE: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  verify:
    runs-on: ubuntu-latest
    # The store tests run against a real PostgreSQL (apps/server/src/db/stores.test.ts), the same
    # image as ops/compose.dev.yml. CI-only credentials; nothing is kept after the job.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: sc
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sc -d sc" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      SC_TEST_DATABASE_URL: postgres://sc:ci-only@127.0.0.1:5432/sc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The same script developers run locally: format check, lint, typecheck, tests, and the
      # kit-version line last.
      - run: pnpm verify
      # The production client has none of the development tools (D63): built, then searched.
      - run: pnpm bundle:check
      # The kit-version watch (DECISIONS D41): the line in the job summary and, when the pin is
      # behind the kit's newest tag, a warning annotation. Never a failure; moving the pin is
      # the owner's word.
      - name: Kit version
        run: pnpm kit:check --ci
        continue-on-error: true
      # Domain and application coverage against the thresholds in vitest.config.ts.
      - run: pnpm test:coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full history, not just the last commit.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: osv-scanner (lockfile)
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src "$OSV_SCANNER_IMAGE" scan source \
            --config=osv-scanner.toml --lockfile=pnpm-lock.yaml --format json --output-file osv.json
          code=$?
          set -e
          # Exit 1 means "findings"; anything else besides 0 is a scanner error.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi
          jq -r '.results[]?.packages[]? | .package as $p | .groups[]?
            | "\($p.name)@\($p.version) \(.ids | join(",")) severity=\(.max_severity // "unknown")"' osv.json
          # High = CVSS >= 7. An unrated finding counts as high so nothing slips through.
          high=$(jq '[.results[]?.packages[]?.groups[]?
            | select((.max_severity // "") == "" or (.max_severity | tonumber) >= 7)] | length' osv.json)
          if [ "$high" -gt 0 ]; then
            echo "::error::$high high or critical osv-scanner finding(s)"
            exit 1
          fi
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner --exit-code 1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Links between the repository's own files (no network: external sites come and go).
      - name: Markdown link check
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$LYCHEE_IMAGE" --offline --no-progress \
            --exclude-path node_modules '**/*.md'

  deploy:
    # The installer and the game's command (ops/): shellcheck through their entry points (it
    # follows the libraries) and the dry-run harness, every question path, file and verb without
    # packages, Docker or a network. As root: the command refuses anyone else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The harness hands out the pinned kit's ops/ from node_modules.
      - uses: ./.github/actions/setup
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" -x \
            ops/install.sh ops/scases ops/test/installer.test.sh
      - name: Installer harness
        run: sudo bash ops/test/installer.test.sh

  image:
    # The production image (Dockerfile), as the installer builds it for a standalone server; the
    # website mode differs in the client's base path only.
    runs-on: ubuntu-latest
    env:
      IMAGE: seasonal-cases:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg SC_MODE=local --build-arg SC_COMMIT="${GITHUB_SHA::7}" -t "$IMAGE" .
      # Only what runs is shipped: these development tools must not be in the image.
      - name: No development tools
        run: |
          docker run --rm --entrypoint ls "$IMAGE" /app/node_modules/.pnpm > packages.txt
          if grep -E '^(@playwright\+|eslint@|jsdom@|lefthook|prettier@|typescript@|vite@|vitest@)' packages.txt; then
            echo "::error::development tools are in the production image"
            exit 1
          fi
      - name: Trivy (HIGH/CRITICAL with a fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE"

  e2e:
    # The journeys in Chromium on every pull request and every push to master; Firefox and WebKit
    # run nightly in ./browsers.yml (CLAUDE.md "Tests and checks").
    runs-on: ubuntu-latest
    # Journey 5 reads the forgotten-password mail from Mailpit's API, as on the dev machine
    # (ops/compose.dev.yml: SMTP 1170, API 8570).
    services:
      mailpit:
        image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
        ports:
          - 1170:1025
          - 8570:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium
      # The run's own stack: server 127.0.0.1:3980 with data under .local/e2e (cleaned at
      # start), client 5480 (e2e/playwright.config.ts).
      - run: pnpm e2e --project=chromium
      # On a failure: the traces of the failed tests, for a week.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
